<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ product_name }} — Login</title>
<link rel="icon" type="image/svg+xml" href="/static/mediawarden.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 50% 20%, rgba(23,190,187,.12), transparent 34%),
      #080d14;
    color: #e2e8f0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-wrap {
    width: 100%;
    max-width: 440px;
    padding: 20px;
  }
  .login-logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .login-logo-icon {
    font-size: 40px;
    display: block;
    margin-bottom: 10px;
  }
  .login-logo-text {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .login-logo-sub {
    font-size: 13px;
    color: #8da1b8;
    margin-top: 3px;
  }
  .login-card {
    background: #121b27;
    border: 1px solid #2b3b50;
    border-radius: 16px;
    padding: 32px;
  }
  .login-title {
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #94a3b8;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-input {
    width: 100%;
    background: #080d14;
    border: 1px solid #31435b;
    border-radius: 9px;
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #e2e8f0;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus { border-color: #17bebb; }
  .form-input.error { border-color: #f87171; }
  .error-msg {
    background: #3b0a0a;
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 7px;
    padding: 10px 14px;
    font-size: 13px;
    color: #fca5a5;
    margin-bottom: 16px;
  }
  .login-btn {
    width: 100%;
    background: #17bebb;
    color: #071014;
    border: none;
    border-radius: 9px;
    padding: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }
  .login-btn:hover { background: #35d3cd; color:#071014; }
  .login-btn:active { background: #089f9b; }
  .login-version {
    margin-top: 18px;
    text-align: center;
    color: #64788f;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <span class="login-logo-icon"><img src="/static/mediawarden.svg" alt="{{ product_name }}" style="width:82px;height:82px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));"></span>
    <div class="login-logo-text">{{ product_name }}</div>
    <div class="login-logo-sub">Plex media safety</div>
  </div>
  <div class="login-card">
    <div class="login-title">Sign in</div>
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input {% if error %}error{% endif %}"
               type="text" id="username" name="username" autofocus autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input {% if error %}error{% endif %}"
               type="password" id="password" name="password" autocomplete="current-password" />
      </div>
      <button class="login-btn" type="submit">Sign in</button>
    </form>
  </div>
  <div class="login-version">{{ product_name }} v{{ app_version }}</div>
</div>
</body>
</html>
