name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: pre-commit==4.6.1

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run unit and safety tests
        run: python -m unittest discover -s tests -v

      - name: Validate Python and rendered JavaScript
        run: |
          python -m compileall -q app.py worker.py src tests
          python -c "import re, app; html=app.app.test_client().get('/').get_data(as_text=True); print('\n'.join(re.findall(r'<script>(.*?)</script>', html, re.S)))" | node -e "new Function(require('fs').readFileSync(0,'utf8'))"

      - name: Validate configuration artifacts
        run: |
          python -c "import pathlib, xml.etree.ElementTree as ET, yaml; yaml.safe_load(pathlib.Path('data/config.yml.example').read_text(encoding='utf-8')); ET.parse('unraid/mediamender.xml')"
          docker compose config --quiet

      - name: Log in to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            liftbridgelabs/mediamender:latest
            liftbridgelabs/mediamender:${{ github.sha }}
