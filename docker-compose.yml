services:
  mediamender:
    image: liftbridgelabs/mediamender:latest
    container_name: mediaMender
    restart: unless-stopped
    ports:
      - "8222:8222"
    volumes:
      # ── Config file ─────────────────────────────────────────────────────────
      # Persist configuration, scheduling state, client identity, and logs.
      # Existing installations can keep their current host data path during migration;
      # this default is for fresh mediaMender deployments.
      - /mnt/cache/appdata/mediamender/data:/app/data

      # ── Media root mounts ────────────────────────────────────────────────────
      # Mount the ROOT of each media area — not individual subfolders.
      # The wizard will let you browse and select the specific paths inside.
      # Paths used in config.yml must be reachable from inside the container.

      # All symlink media (debrid, usenet symlinks):
      # slave propagation is required so FUSE mounts (Decypharr, zurg, etc.)
      # created after container start are visible inside the container.
      - /mnt/symlink_media:/mnt/symlink_media:ro,slave

      # Optional manual timestamp repair. The writable container path must
      # exactly match the path Plex stores in its database. Keep this narrow.
      # - /mnt/symlink_media/symlinks/nzbdav:/mnt/symlink_media/symlinks/nzbdav:rw,slave

      # Optional read-only Plex SQLite detector. Map only the database folder.
      # - /mnt/cache/appdata/plex/Library/Application Support/Plex Media Server/Plug-in Support/Databases:/plex-db:ro

      # Physical media:
      - /mnt/user/media:/mnt/user/media:ro

    environment:
      # Configure Plex, providers, notifications, auth, and logging in the UI.
      # Those settings persist in ./data/config.yml. Non-empty environment
      # variables can still be added here as deployment-managed overrides.
      # Only these container runtime settings normally belong here:
      - PUID=99
      - PGID=100
      - TZ=America/New_York

  # Optional repair-only sidecar for a Plex server on another machine. Deploy
  # this service on that machine, not beside the controller above. The Settings
  # wizard generates a completed example with per-instance paths and a secret.
  # mediamender-repair-worker:
  #   image: liftbridgelabs/mediamender:latest
  #   container_name: mediamender-repair-worker
  #   restart: unless-stopped
  #   ports:
  #     - "8223:8223"
  #   environment:
  #     - MEDIAMENDER_ROLE=repair-worker
  #     - MEDIAMENDER_WORKER_NAME=altmount-worker
  #     - MEDIAMENDER_WORKER_TOKEN=SET_IN_DOCKGE_ENV
  #     - MEDIAMENDER_WORKER_DATABASE_ROOTS=/plex-db
  #     - MEDIAMENDER_WORKER_MEDIA_ROOTS=/mnt/symlink_media/symlinks/provider
  #     - PUID=99
  #     - PGID=100
  #   volumes:
  #     - ${MEDIAMENDER_WORKER_DATA_DIR:?Set an absolute worker-data host path}:/app/data
  #     - /host/plex/Databases:/plex-db:ro
  #     # The destination must exactly match the path stored by Plex.
  #     - /host/provider-links:/mnt/symlink_media/symlinks/provider:rw,slave
